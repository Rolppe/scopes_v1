name: Skoopit
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Skoopit:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources, Resources]
    # Äpin oma WireGuard-tunneli (SCOPES-ETAYHTEYS): tunneli/rakenna.sh kääntää Macissa ennen xcodegeniä.
    dependencies:
      - framework: tunneli/Tunneli.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.skoopit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [SkoopitUITests]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Scopes
        UILaunchScreen: {}
        # Vaaka chat- ja listanäkymään (käyttäjä 14.10.2026, DESIGN-VAAKATUKI); ylösalaisin ei iPhonessa.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Sovellus lukee skooppien tilan kotipalvelimelta.
        NSCameraUsageDescription: Kameralla otettu kuva liitetään skoopin viestiin.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  SkoopitUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [UITests]
    dependencies:
      - target: Skoopit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.skoopit.uitests
        GENERATE_INFOPLIST_FILE: YES
